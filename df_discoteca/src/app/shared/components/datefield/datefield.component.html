<label class="datefield">

  @if (label) {
    <span class="datefield__label">
      {{ label }}
    </span>
  }

  <span class="datefield__wrap">

    <input
      #input
      class="datefield__control"
      [type]="type"
      [value]="value"
      [disabled]="disabled"
      [attr.required]="required ? '' : null"
      [attr.min]="min"
      [attr.max]="max"
      (input)="onInput($any($event).target.value)"
      (blur)="onBlur()"
    />

    <button
      type="button"
      class="datefield__icono"
      aria-label="Abrir selector"
      [disabled]="disabled"
      (click)="abrirSelector(input)">

      @if (type === 'time') {

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>

      } @else {

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="16" rx="3" />
          <path d="M3 9.5h18M8 3v3M16 3v3" />
        </svg>

      }

    </button>

  </span>

</label>
