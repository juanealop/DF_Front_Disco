<div class="login-page">

  <!-- PORTADA -->
  <section class="login-cover">
    <img
    src="/assets/images/login_2_portada_df_disco.jpg"
    alt="DF Partners"
    class="login-cover__image"
   />
    <div class="login-cover__overlay"></div>

    
  </section>


  <!-- FORMULARIO -->
  <section class="login-form-container">

    <div class="login-form">

      <!-- TÍTULO -->
      <div class="login-form__header">
        <h2>DF Partners</h2>

        <p>
          Inicia sesión en tu cuenta
        </p>
      </div>


      <!-- FORMULARIO -->
      <form (ngSubmit)="login()">

        <!-- CORREO -->
        <div class="textfield">

          <label for="email">
            Correo
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Ingresa tu correo"
            autocomplete="email"
          />

        </div>


        <!-- CONTRASEÑA -->
        <div class="textfield">

          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />

        </div>


        <!-- BOTÓN -->
        <button
          type="submit"
          class="login-button"
        >
          Ingresar
        </button>

      </form>


      <!-- REGISTRO -->
      <div class="login-register">

        <span>
          ¿No tienes cuenta?
        </span>

        <button
          type="button"
          class="login-register__link"
          (click)="goToRegister()"
        >
          Regístrate aquí
        </button>

      </div>

    </div>

  </section>

</div>
