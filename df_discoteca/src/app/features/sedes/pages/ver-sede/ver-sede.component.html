<div class="ver-sede">

  <section class="ver-sede__card">

    <!-- =====================================================
         CABECERA
         ===================================================== -->
    <header class="ver-sede__header">
      <h1 class="ver-sede__titulo">{{ sede?.nombre || 'Ver sede' }}</h1>
      <p class="ver-sede__subtitulo">Consulta y edita los datos de la sede</p>
    </header>

    @if (cargandoSede) {
      <p class="ver-sede__estado">Cargando sede…</p>
    } @else {
      <!-- ===================================================
           FORMULARIO
           =================================================== -->
      <form class="ver-sede__form" (ngSubmit)="actualizarSede()">

        <div class="ver-sede__grid">

          <!-- DATOS -->
          <div class="ver-sede__campos">

            <app-textfield
              name="nombre"
              label="Nombre"
              placeholder="Ej. Cantina 116"
              autocomplete="organization"
              [(ngModel)]="nombre"
              [required]="true"
              [maxlength]="120"
            />

            <app-textfield
              name="descripcion"
              label="Descripción"
              placeholder="Cuenta algo sobre la sede (opcional)"
              autocomplete="off"
              [(ngModel)]="descripcion"
              [multiline]="true"
              [maxlength]="500"
            />

            <div class="ver-sede__fila">

              <app-textfield
                name="pais"
                label="País"
                placeholder="Colombia"
                [(ngModel)]="pais"
                [required]="true"
                [maxlength]="80"
              />

              <app-textfield
                name="ciudad"
                label="Ciudad"
                placeholder="Bogotá"
                [(ngModel)]="ciudad"
                [required]="true"
                [maxlength]="80"
              />

            </div>

            <app-textfield
              name="direccion"
              label="Dirección"
              placeholder="Calle 123 #45-67"
              autocomplete="street-address"
              [(ngModel)]="direccion"
              [required]="true"
              [maxlength]="180"
            />

          </div>

          <!-- IMÁGENES -->
          <div class="ver-sede__imagenes">

            <label class="upload" for="sede-imagenes">

              <svg class="upload__icono" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4.5" width="18" height="15" rx="3" />
                <circle cx="8.5" cy="10" r="1.6" />
                <path d="M21 15.5l-4.5-4.5L7 20.5" />
              </svg>

              <span class="upload__texto">
                Sube hasta {{ maxImagenes }} imágenes de la sede
              </span>

              <span class="upload__ayuda">
                PNG o JPG · máximo {{ maxImagenes }} imágenes
              </span>

              <input
                id="sede-imagenes"
                class="upload__input"
                type="file"
                accept="image/*"
                multiple
                (change)="onImagenesSeleccionadas($event)"
              />

            </label>

            @if (imagenes.length) {
              <ul class="preview">
                @for (imagen of imagenes; track imagen.url; let i = $index) {
                  <li class="preview__item">
                    <img
                     [src]="imagen.url"
                     [alt]="imagen.nombre || 'Imagen de la sede'"
                     (click)="verImagen(imagen.url)"
                     class="preview__imagen"
                     />
                    <button
                      type="button"
                      class="preview__quitar"
                      aria-label="Quitar imagen"
                      (click)="quitarImagen(i)">
                      ×
                    </button>
                  </li>
                }
              </ul>
            }

          </div>   


          @if (imagenSeleccionada) {
  <div
    class="imagen-modal"
    (click)="cerrarImagen()"
  >

    <div
      class="imagen-modal__contenido"
      (click)="$event.stopPropagation()"
    >

      <button
        type="button"
        class="imagen-modal__cerrar"
        (click)="cerrarImagen()"
        aria-label="Cerrar imagen"
      >
        ×
      </button>

      <img
        [src]="imagenSeleccionada"
        alt="Imagen ampliada de la sede"
        class="imagen-modal__imagen"
      />

    </div>

  </div>
}

        </div>

        @if (error) {
          <div class="ver-sede__error">{{ error }}</div>
        }

        <!-- ACCIONES -->
        <footer class="ver-sede__acciones">

          <button
            type="button"
            class="ver-sede__cancelar"
            (click)="volverAtras()">
            Volver atrás
          </button>

          <div class="ver-sede__submit">
            <app-button
              text="Actualizar"
              type="submit"
              [loading]="cargando"
            />
          </div>

        </footer>

      </form>
    }

  </section>

</div>
